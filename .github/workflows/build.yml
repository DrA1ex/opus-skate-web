name: Build and deploy web

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize, closed ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build
        run: bash build-web.sh

      - name: Verify output
        run: |
          test -s dist/index.html
          test -s dist/index.js
          test -s dist/index.wasm

      - name: Set up browser smoke test
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright
          npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          python3 -m http.server 8000 -d dist > /tmp/opus-skate-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          node scripts/browser-smoke.js

      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: runtime-smoke*.png
          if-no-files-found: ignore

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: opus-skate-web
          path: dist/

  deploy-main:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    concurrency:
      group: pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download web build
        uses: actions/download-artifact@v5
        with:
          name: opus-skate-web
          path: dist

      - name: Deploy main site
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            pr-preview
          force: false

  deploy-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write
      pull-requests: write

    concurrency:
      group: pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download web build
        uses: actions/download-artifact@v5
        with:
          name: opus-skate-web
          path: dist

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false

  remove-preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    concurrency:
      group: pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove
          qr-code: false
