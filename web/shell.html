<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Concrete Jungle — OpusSkate Web</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #08090b; overflow: hidden; }
    body { display: grid; place-items: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    #stage { position: relative; width: 100vw; height: 100vh; display: grid; place-items: center; }
    #canvas { display: block; outline: none; background: #000; max-width: 100vw; max-height: 100vh; }
    #status {
      position: absolute; left: 16px; bottom: 14px; color: #d8d8d8;
      background: rgba(0,0,0,.55); padding: 7px 9px; border-radius: 4px;
      font-size: 12px; pointer-events: none; transition: opacity .25s;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading…</div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');

    function fitCanvas() {
      const w = canvas.width || 1280;
      const h = canvas.height || 720;
      const aspect = w / h;
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      if (vw / vh > aspect) {
        canvas.style.height = vh + 'px';
        canvas.style.width = Math.round(vh * aspect) + 'px';
      } else {
        canvas.style.width = vw + 'px';
        canvas.style.height = Math.round(vw / aspect) + 'px';
      }
    }

    window.addEventListener('resize', fitCanvas);
    window.addEventListener('keydown', (event) => {
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(event.code)) {
        event.preventDefault();
      }
      canvas.focus({ preventScroll: true });
    }, { passive: false });

    canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));

    var Module = {
      canvas,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: (text) => {
        status.textContent = text || '';
        status.style.opacity = text ? '1' : '0';
      },
      onRuntimeInitialized: () => {
        fitCanvas();
        canvas.focus({ preventScroll: true });
        status.style.opacity = '0';
      }
    };

    fitCanvas();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
