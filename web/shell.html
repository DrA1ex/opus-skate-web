<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Concrete Jungle — OpusSkate Web</title>
  <style>
    :root {
      --control-size: 56px;
      --pad-size: 172px;
      --action-size: 172px;
      --control-bg: rgba(10, 13, 18, 0.42);
      --control-border: rgba(255, 255, 255, 0.28);
      --control-active: rgba(255, 255, 255, 0.34);
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; background: #08090b; overflow: hidden;
      overscroll-behavior: none; touch-action: none;
    }
    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }

    #stage {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
      overflow: hidden; background: #000;
    }
    #canvas {
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      max-width: none; max-height: none; outline: none; background: #000;
    }
    #status {
      position: absolute; left: 16px; bottom: 14px; z-index: 20;
      color: #d8d8d8; background: rgba(0,0,0,.55); padding: 7px 9px;
      border-radius: 4px; font-size: 12px; pointer-events: none;
      transition: opacity .25s;
    }

    #touch-controls {
      position: absolute; inset: 0; z-index: 10; display: none;
      pointer-events: none; touch-action: none;
    }
    .touch-enabled #touch-controls { display: block; }

    #mobile-title-menu {
      position: absolute; left: 50%; top: 43%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; gap: 12px; width: min(78vw, 320px);
      pointer-events: auto; z-index: 14;
    }
    .touch-enabled #stage.mobile-title #mobile-title-menu { display: flex; }
    .touch-enabled #stage.mobile-title #dpad,
    .touch-enabled #stage.mobile-title #actions { display: none; }

    .mobile-menu-button {
      min-height: 58px; border: 1px solid rgba(255,255,255,.38); border-radius: 14px;
      background: rgba(12, 15, 20, .72); color: #fff;
      font: 700 15px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .05em; text-shadow: 0 1px 2px #000;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      touch-action: manipulation;
    }
    .mobile-menu-button:active { transform: scale(.97); background: rgba(55, 60, 70, .82); }
    .mobile-menu-button:disabled { opacity: .45; }

    @media (orientation: landscape) {
      #mobile-title-menu {
        top: 50%; width: min(60vw, 520px); flex-direction: row;
      }
      .mobile-menu-button { flex: 1; }
    }

    .control-button {
      position: absolute; width: var(--control-size); height: var(--control-size);
      border: 1px solid var(--control-border); border-radius: 50%;
      background: var(--control-bg); color: rgba(255,255,255,.9);
      display: grid; place-items: center;
      font: 700 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .04em; text-shadow: 0 1px 2px #000;
      pointer-events: auto; touch-action: none;
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      transition: transform 45ms linear, background 45ms linear, border-color 45ms linear;
    }
    .control-button.active {
      background: var(--control-active); border-color: rgba(255,255,255,.72);
    }

    #dpad {
      position: absolute;
      left: max(10px, env(safe-area-inset-left));
      bottom: max(10px, env(safe-area-inset-bottom));
      width: var(--pad-size); height: var(--pad-size);
      border: 2px solid rgba(255,255,255,.30);
      border-radius: 50%;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.06) 0 24%, transparent 25%),
        rgba(6, 9, 13, .32);
      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.32),
        inset 0 0 24px rgba(0,0,0,.25),
        0 2px 10px rgba(0,0,0,.18);
      pointer-events: auto;
      touch-action: none;
    }
    #dpad::before {
      content: "";
      position: absolute;
      inset: 15%;
      border: 1px dashed rgba(255,255,255,.16);
      border-radius: 50%;
      pointer-events: none;
    }
    #dpad::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 64%; height: 64%;
      transform: translate(-50%, -50%);
      background:
        linear-gradient(to right, transparent 49.4%, rgba(255,255,255,.12) 49.5% 50.5%, transparent 50.6%),
        linear-gradient(to bottom, transparent 49.4%, rgba(255,255,255,.12) 49.5% 50.5%, transparent 50.6%);
      pointer-events: none;
    }
    #dpad .control-button {
      width: 30%; height: 30%;
      border: 0;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      font-size: 15px;
      z-index: 2;
    }
    #dpad .control-button.active {
      background: rgba(255,255,255,.10);
      border: 0;
    }
    #dpad-up { left: 50%; top: 2%; transform: translateX(-50%); }
    #dpad-down { left: 50%; bottom: 2%; transform: translateX(-50%); }
    #dpad-left { left: 2%; top: 50%; transform: translateY(-50%); }
    #dpad-right { right: 2%; top: 50%; transform: translateY(-50%); }
    #dpad-up.active, #dpad-down.active { transform: translateX(-50%); }
    #dpad-left.active, #dpad-right.active { transform: translateY(-50%); }

    #dpad-knob {
      position: absolute;
      left: 50%; top: 50%;
      width: 34%; height: 34%;
      transform: translate(-50%, -50%) translate(var(--joy-x, 0px), var(--joy-y, 0px));
      border: 1px solid rgba(255,255,255,.48);
      border-radius: 50%;
      background: rgba(38, 43, 52, .70);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.24), 0 2px 8px rgba(0,0,0,.28);
      pointer-events: none;
      z-index: 3;
    }
    #dpad.joystick-active {
      border-color: rgba(255,255,255,.62);
      background:
        radial-gradient(circle at center, rgba(255,255,255,.09) 0 24%, transparent 25%),
        rgba(12, 16, 22, .44);
    }
    #dpad.joystick-active #dpad-knob {
      background: rgba(78, 85, 98, .84);
      border-color: rgba(255,255,255,.78);
    }

    #actions {
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      width: var(--action-size); height: var(--action-size);
      pointer-events: none; touch-action: none;
    }
    #actions .control-button { pointer-events: auto; }
    #action-ollie {
      width: calc(var(--control-size) * 1.14); height: calc(var(--control-size) * 1.14);
      left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(45, 48, 58, .56); font-size: 13px;
    }
    #action-ollie.active { transform: translate(-50%, -50%) scale(.92); }
    #action-flip { left: 50%; top: 0; transform: translateX(-50%); }
    #action-flip.active { transform: translateX(-50%) scale(.92); }
    #action-manual { left: 50%; bottom: 0; transform: translateX(-50%); }
    #action-manual.active { transform: translateX(-50%) scale(.92); }
    #action-grind { left: 0; top: 50%; transform: translateY(-50%); }
    #action-grind.active { transform: translateY(-50%) scale(.92); }
    #action-grab { right: 0; top: 50%; transform: translateY(-50%); }
    #action-grab.active { transform: translateY(-50%) scale(.92); }

    .compact-controls .control-button { font-size: 10px; }
    .compact-controls #action-ollie { font-size: 11px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Loading…</div>

    <div id="touch-controls" aria-hidden="true">
      <div id="mobile-title-menu" aria-label="Game mode">
        <button class="mobile-menu-button" data-menu-action="9" disabled>FREE SKATE</button>
        <button class="mobile-menu-button" data-menu-action="10" disabled>2 MIN SESSION</button>
      </div>

      <div id="dpad" aria-label="Movement joystick">
        <div id="dpad-knob" aria-hidden="true"></div>
        <div class="control-button" id="dpad-up" data-dir="up">▲</div>
        <div class="control-button" id="dpad-down" data-dir="down">▼</div>
        <div class="control-button" id="dpad-left" data-dir="left">◀</div>
        <div class="control-button" id="dpad-right" data-dir="right">▶</div>
      </div>

      <div id="actions" aria-label="Trick controls">
        <div class="control-button" id="action-flip" data-action="flip">FLIP</div>
        <div class="control-button" id="action-grind" data-action="grind">GRIND</div>
        <div class="control-button" id="action-ollie" data-action="ollie">OLLIE</div>
        <div class="control-button" id="action-grab" data-action="grab">GRAB</div>
        <div class="control-button" id="action-manual" data-action="manual">MANUAL</div>
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const touchControls = document.getElementById('touch-controls');
    const dpad = document.getElementById('dpad');
    const dpadKnob = document.getElementById('dpad-knob');

    const ACTION = Object.freeze({
      up: 0,
      down: 1,
      left: 2,
      right: 3,
      ollie: 4,
      flip: 5,
      grab: 6,
      grind: 7,
      manual: 8
    });

    const forcedTouch = new URLSearchParams(location.search).get('touch') === '1';
    const touchMode = forcedTouch || navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches;
    document.documentElement.classList.toggle('touch-enabled', touchMode);
    touchControls.setAttribute('aria-hidden', touchMode ? 'false' : 'true');
    stage.classList.toggle('mobile-title', touchMode);

    let runtimeReady = false;
    let lastGameWidth = 0;
    let lastGameHeight = 0;
    let resizeTimer = 0;
    const pressed = new Set();
    const actionPointers = new Map();
    let dpadPointer = null;

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function viewportRect() {
      const viewport = window.visualViewport;
      const innerWidthNow = Math.max(1, window.innerWidth);
      const innerHeightNow = Math.max(1, window.innerHeight);

      if (!viewport) {
        return { left: 0, top: 0, width: innerWidthNow, height: innerHeightNow };
      }

      const innerLandscape = innerWidthNow >= innerHeightNow;
      const visualLandscape = viewport.width >= viewport.height;
      const visualIsCurrent = innerLandscape === visualLandscape;

      // iOS Safari can leave visualViewport on the previous orientation for a
      // short time after rotation. In that window, innerWidth/innerHeight are
      // already correct, so prefer them instead of keeping the stale layout.
      if (!visualIsCurrent) {
        return { left: 0, top: 0, width: innerWidthNow, height: innerHeightNow };
      }

      return {
        left: Math.round(viewport.offsetLeft),
        top: Math.round(viewport.offsetTop),
        width: Math.max(1, Math.round(viewport.width)),
        height: Math.max(1, Math.round(viewport.height))
      };
    }

    function syncViewport() {
      const rect = viewportRect();
      const shortSide = Math.min(rect.width, rect.height);
      const controlSize = Math.round(clamp(shortSide * .145, 42, 64));
      const clusterSize = Math.round(controlSize * 3.22);

      stage.style.left = rect.left + 'px';
      stage.style.top = rect.top + 'px';
      stage.style.width = rect.width + 'px';
      stage.style.height = rect.height + 'px';
      stage.style.setProperty('--control-size', controlSize + 'px');
      stage.style.setProperty('--pad-size', clusterSize + 'px');
      stage.style.setProperty('--action-size', clusterSize + 'px');
      stage.classList.toggle('compact-controls', shortSide < 330);

      canvas.style.width = '100%';
      canvas.style.height = '100%';

      if (runtimeReady && Module._web_resize &&
          (rect.width !== lastGameWidth || rect.height !== lastGameHeight)) {
        lastGameWidth = rect.width;
        lastGameHeight = rect.height;
        Module._web_resize(rect.width, rect.height);
      }
    }

    function queueViewportSync() {
      syncViewport();
      requestAnimationFrame(syncViewport);
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(syncViewport, 180);
    }

    function sendInput(name, down) {
      if (!runtimeReady || !Module._mobile_input) return;

      const action = ACTION[name];
      if (action === undefined) return;
      Module._mobile_input(action, down ? 1 : 0);
    }

    function setPressed(name, down) {
      const isDown = pressed.has(name);
      if (isDown === down) return;

      if (down) pressed.add(name);
      else pressed.delete(name);
      sendInput(name, down);

      const dir = document.querySelector(`[data-dir="${name}"]`);
      const action = document.querySelector(`[data-action="${name}"]`);
      (dir || action)?.classList.toggle('active', down);
    }

    function setDirections(next) {
      for (const name of ['up', 'down', 'left', 'right']) setPressed(name, next.has(name));
    }

    function dpadVector(clientX, clientY) {
      const rect = dpad.getBoundingClientRect();
      return {
        rect,
        x: (clientX - (rect.left + rect.width * .5)) / (rect.width * .5),
        y: (clientY - (rect.top + rect.height * .5)) / (rect.height * .5)
      };
    }

    function updateDpad(clientX, clientY) {
      const { rect, x, y } = dpadVector(clientX, clientY);
      const next = new Set();
      const deadZone = .23;

      if (x < -deadZone) next.add('left');
      if (x > deadZone) next.add('right');
      if (y < -deadZone) next.add('up');
      if (y > deadZone) next.add('down');
      setDirections(next);

      const magnitude = Math.hypot(x, y);
      const scale = magnitude > 1 ? 1 / magnitude : 1;
      const travel = rect.width * .24;
      dpad.style.setProperty('--joy-x', (x * scale * travel).toFixed(1) + 'px');
      dpad.style.setProperty('--joy-y', (y * scale * travel).toFixed(1) + 'px');
      dpad.classList.add('joystick-active');
    }

    function releaseDpad() {
      dpadPointer = null;
      setDirections(new Set());
      dpad.style.setProperty('--joy-x', '0px');
      dpad.style.setProperty('--joy-y', '0px');
      dpad.classList.remove('joystick-active');
    }

    function releasePointer(pointerId) {
      if (pointerId === dpadPointer) releaseDpad();

      const name = actionPointers.get(pointerId);
      if (name) {
        actionPointers.delete(pointerId);
        if (![...actionPointers.values()].includes(name)) setPressed(name, false);
      }
    }

    function releaseAll() {
      releaseDpad();
      for (const name of ['ollie', 'flip', 'grab', 'grind', 'manual']) setPressed(name, false);
      actionPointers.clear();
    }

    dpad.addEventListener('pointerdown', (event) => {
      if (!touchMode) return;

      const start = dpadVector(event.clientX, event.clientY);
      if (Math.hypot(start.x, start.y) > 1.05) return;

      event.preventDefault();
      if (dpadPointer !== null && dpadPointer !== event.pointerId) releaseDpad();
      dpadPointer = event.pointerId;
      try { dpad.setPointerCapture?.(event.pointerId); } catch {}
      updateDpad(event.clientX, event.clientY);
      canvas.focus({ preventScroll: true });
    });

    dpad.addEventListener('pointermove', (event) => {
      if (event.pointerId !== dpadPointer) return;
      event.preventDefault();
      updateDpad(event.clientX, event.clientY);
    });

    document.addEventListener('pointermove', (event) => {
      if (event.pointerId !== dpadPointer) return;
      updateDpad(event.clientX, event.clientY);
    }, true);

    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      dpad.addEventListener(type, (event) => {
        if (event.pointerId === dpadPointer) releaseDpad();
      });
    }

    document.querySelectorAll('[data-action]').forEach((button) => {
      const name = button.dataset.action;

      button.addEventListener('pointerdown', (event) => {
        if (!touchMode) return;
        event.preventDefault();
        try { button.setPointerCapture?.(event.pointerId); } catch {}
        actionPointers.set(event.pointerId, name);
        setPressed(name, true);
        canvas.focus({ preventScroll: true });
      });

      const release = (event) => releasePointer(event.pointerId);

      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
    });

    document.addEventListener('pointerup', (event) => releasePointer(event.pointerId), true);
    document.addEventListener('pointercancel', (event) => releasePointer(event.pointerId), true);
    window.addEventListener('pointerout', (event) => {
      if (!event.relatedTarget) releasePointer(event.pointerId);
    });
    document.addEventListener('touchend', (event) => {
      if (event.touches.length === 0) releaseAll();
    }, { passive: true, capture: true });
    document.addEventListener('touchcancel', releaseAll, { passive: true, capture: true });

    window.addEventListener('resize', queueViewportSync);
    window.addEventListener('orientationchange', () => {
      releaseAll();
      queueViewportSync();
      setTimeout(queueViewportSync, 350);
    });
    window.visualViewport?.addEventListener('resize', queueViewportSync);
    window.visualViewport?.addEventListener('scroll', queueViewportSync);
    window.screen?.orientation?.addEventListener?.('change', () => {
      releaseAll();
      queueViewportSync();
    });

    window.addEventListener('blur', releaseAll);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) releaseAll();
    });

    function startMobileGame(action) {
      if (!runtimeReady || !Module._mobile_input) return;

      releaseAll();
      Module._mobile_input(action, 1);
      Module._mobile_input(action, 0);
      stage.classList.remove('mobile-title');
    }

    document.querySelectorAll('[data-menu-action]').forEach((button) => {
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        startMobileGame(Number(button.dataset.menuAction));
      });
    });

    window.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) {
        event.preventDefault();
      }
      canvas.focus({ preventScroll: true });
    }, { passive: false });

    canvas.addEventListener('pointerdown', () => canvas.focus({ preventScroll: true }));

    var Module = {
      canvas,
      print: (...args) => console.log(...args),
      printErr: (...args) => console.error(...args),
      setStatus: (text) => {
        status.textContent = text || '';
        status.style.opacity = text ? '1' : '0';
      },
      onRuntimeInitialized: () => {
        runtimeReady = true;
        Module._web_set_mobile?.(touchMode ? 1 : 0);
        document.querySelectorAll('[data-menu-action]').forEach((button) => { button.disabled = false; });
        for (const name of pressed) sendInput(name, true);
        queueViewportSync();
        canvas.focus({ preventScroll: true });
        status.style.opacity = '0';
      }
    };

    queueViewportSync();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
